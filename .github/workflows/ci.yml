# Modified for GVitals on 2026-11-07.
name: Continuous integration

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Tests and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install GNOME and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gjs libglib2.0-bin libglib2.0-dev-bin gir1.2-gtk-4.0 gir1.2-adw-1 xvfb xauth dbus-x11 gettext zip nodejs

      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done < <(find . -path './.git' -prune -o -name '*.js' -print0)

      - name: Run sensor and logic tests
        run: ./tests/run.sh

      - name: Run GTK preferences integration tests
        run: dbus-run-session -- xvfb-run -a ./tests/run-ui.sh

      - name: Validate and compile translations
        run: ./tools/compile-translations.sh

      - name: Build and validate release archive
        run: |
          ./tools/package.sh "$RUNNER_TEMP/gvitals.zip"
          python3 tests/check-package.py "$RUNNER_TEMP/gvitals.zip" --expect-translations

      - name: Check whitespace errors
        run: git diff --check
